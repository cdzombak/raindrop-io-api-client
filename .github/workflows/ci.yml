name: CI

on: [ push, pull_request ]

jobs:
  lint:
    name: Run linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run tests
        run: go mod tidy && go test -race ./...
